name: Isolated WebKit diagnostics
on:
  push:
    branches: ['probe/v142-webkit-*']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [ipad-webkit, landscape-webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - run: npm run test:e2e:production -- --project=${{ matrix.profile }} --workers=1 --repeat-each=6 --grep='all four modes click|a whole sentence presses'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-${{ matrix.profile }}
          retention-days: 1
          path: |
            .local/qa/*.json
            .local/playwright-results/

name: Validate and publish reader
on:
  push:
    branches: [main, 'rehearsal/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r scripts/requirements-audio.txt
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run scan:public
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:content
      - run: npm run test:audio
      - run: npm run build
      - run: npm run release:check
      - run: npm run test:e2e:production
      - run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: .local/qa/*.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified dist
        id: deployment
        uses: actions/deploy-pages@v4
  online:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/content.mjs validate
      - run: node scripts/check-online.mjs --url https://lls144.github.io/english-ear-player/
        env:
          EAR_ONLINE_CI_ONLY: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: online-validation
          path: .local/qa/online*.json


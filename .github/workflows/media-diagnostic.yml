name: Diagnose WebKit startup
on:
  push:
    branches: ['diagnostic/webkit-startup-v14']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, early-observer]
        transport: [direct, proxy]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - if: matrix.mode == 'early-observer'
        run: node scripts/webkit-startup-probe.mjs --patch-only
      - run: npm run build
      - run: node scripts/webkit-startup-probe.mjs
        env:
          PROBE_MODE: ${{ matrix.mode }}
          PROBE_TRANSPORT: ${{ matrix.transport }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.mode }}-${{ matrix.transport }}
          path: .local/qa/webkit-startup-probe.json
          retention-days: 1

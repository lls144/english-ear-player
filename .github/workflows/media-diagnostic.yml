name: Diagnose WebKit startup
on:
  push:
    branches: ['diagnostic/webkit-startup-v14']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, early-observer]
        project: [ipad-webkit, landscape-webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - if: matrix.mode == 'early-observer'
        run: node scripts/webkit-startup-probe.mjs --patch-only
      - run: npm run build
      - run: npm run test:e2e:production -- --project=${{ matrix.project }} --grep "all published chapter files|three native listening presets" --repeat-each=5 --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.mode }}-${{ matrix.project }}
          path: |
            .local/qa/*.json
            .local/playwright-results/
          retention-days: 1
